<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配達記録ノート</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #4caf50;
      --border-color: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    h1, h2, h3 {
      margin: 0 0 10px 0;
      font-weight: 600;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }
    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .flex-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    input[type="number"], input[type="text"], select {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    button:active {
      opacity: 0.8;
    }
    .btn-main {
      background-color: var(--accent-color);
      border: none;
    }
    .btn-danger {
      background-color: #f44336;
      border: none;
    }
    .btn-undo {
      background-color: #ff9800;
      border: none;
      width: 100%;
      margin-top: 8px;
    }
    
    /* 各業者ボタンのスタイリング */
    .btn-uber { background-color: #06C167; color: #000; border: none; font-weight: bold; }
    .btn-menu { background-color: #FF0033; color: #fff; border: none; font-weight: bold; }
    .btn-pickgo { background-color: #00aaff; color: #fff; border: none; font-weight: bold; }
    .btn-rocket { background-color: #8a2be2; color: #fff; border: none; font-weight: bold; }

    .stat-val {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }
    .stat-label {
      font-size: 11px;
      color: #aaa;
    }
    .sub-text {
      font-size: 12px;
      color: #888;
    }
    .log-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding: 6px 0;
      font-size: 13px;
    }
    .log-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <!-- 本日の目標 & 状況 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h2 style="font-size: 16px;">本日の進捗</h2>
      <span id="cycle-time" class="sub-text">サイクル: 04:00 ~ 翌03:59</span>
    </div>
    <div class="grid-4" style="text-align: center;">
      <div>
        <div class="stat-label">残目標金額</div>
        <div id="rem-amount" class="stat-val">11,000円</div>
      </div>
      <div>
        <div class="stat-label">達成金額</div>
        <div id="curr-amount" class="stat-val">0円</div>
      </div>
      <div>
        <div class="stat-label">配達件数</div>
        <div id="curr-count" class="stat-val">0 / 22</div>
      </div>
      <div>
        <div class="stat-label">アベレージ</div>
        <div id="avg-reward" class="stat-val">0円</div>
      </div>
    </div>
  </div>

  <!-- 配達の入力 -->
  <div class="card">
    <h3 style="font-size: 14px;">件数・報酬記録</h3>
    <div class="grid-2" style="margin-bottom: 8px;">
      <input type="number" id="input-amount" placeholder="報酬金額 (円)" inputmode="numeric">
      <input type="number" id="input-count" value="1" placeholder="件数" inputmode="numeric">
    </div>
    <div class="grid-4">
      <button class="btn-uber" onclick="addRecord('Uber Eats')">Uber</button>
      <button class="btn-menu" onclick="addRecord('menu')">menu</button>
      <button class="btn-pickgo" onclick="addRecord('PickGo')">PickGo</button>
      <button class="btn-rocket" onclick="addRecord('Rocket Now')">Rocket</button>
    </div>
    <button class="btn-undo" onclick="undoLastRecord()">直前の取り消し</button>
  </div>

  <!-- 現在目標ペース計算 (直前の取り消しの下に配置) -->
  <div class="card">
    <h3 style="font-size: 14px;">現在目標ペース計算</h3>
    <div class="grid-2" style="margin-bottom: 8px;">
      <div>
        <span class="stat-label">残目標件数 (個別に測る場合)</span>
        <input type="number" id="pace-target-count" value="" placeholder="未設定（例: 10）" inputmode="numeric" oninput="calculatePace()">
      </div>
      <div>
        <span class="stat-label">残り時限数 (時間)</span>
        <input type="number" id="pace-hours" value="" placeholder="未設定（例: 3）" step="0.5" inputmode="decimal" oninput="calculatePace()">
      </div>
    </div>
    <div style="background-color: #262626; padding: 8px; border-radius: 4px; text-align: center;">
      <div class="stat-label">必要ペース</div>
      <div id="pace-result" style="font-size: 16px; font-weight: bold; color: #4caf50;">- 件 / 時間</div>
    </div>
  </div>

  <!-- 配達履歴 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h3 style="font-size: 14px; margin: 0;">本日の履歴</h3>
      <button style="padding: 4px 8px; font-size: 11px;" class="btn-danger" onclick="resetDay()">本日分リセット</button>
    </div>
    <div id="log-list" style="max-height: 180px; overflow-y: auto;">
      <div class="sub-text" style="text-align: center; padding: 10px;">履歴はありません</div>
    </div>
  </div>

  <script>
    // 基本設定
    const TARGET_AMOUNT = 11000;
    const TARGET_COUNT = 22;

    // 旧アプリと同じキー名（delivery_logs）で読み込み
    let records = JSON.parse(localStorage.getItem('delivery_logs') || '[]');

    function saveData() {
      // 旧アプリと同じキー名（delivery_logs）で保存
      localStorage.setItem('delivery_logs', JSON.stringify(records));
      updateUI();
    }

    function addRecord(platform) {
      const amountInput = document.getElementById('input-amount');
      const countInput = document.getElementById('input-count');

      const amount = parseInt(amountInput.value) || 0;
      const count = parseInt(countInput.value) || 1;

      if (amount <= 0) {
        alert('報酬金額を入力してください。');
        return;
      }

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      records.unshift({
        id: Date.now(),
        platform: platform,
        amount: amount,
        count: count,
        time: timeStr
      });

      amountInput.value = '';
      countInput.value = '1';

      saveData();
    }

    function undoLastRecord() {
      if (records.length === 0) {
        alert('取り消す履歴がありません。');
        return;
      }
      if (confirm('直前の記録を取り消しますか？')) {
        records.shift();
        saveData();
      }
    }

    function resetDay() {
      if (confirm('本日のすべての記録を消去しますか？')) {
        records = [];
        saveData();
      }
    }

    function calculatePace() {
      const targetCountInput = document.getElementById('pace-target-count').value;
      const hoursInput = document.getElementById('pace-hours').value;
      const resultEl = document.getElementById('pace-result');

      const targetCount = parseFloat(targetCountInput);
      const hours = parseFloat(hoursInput);

      if (!isNaN(targetCount) && !isNaN(hours) && hours > 0) {
        const pace = (targetCount / hours).toFixed(1);
        resultEl.textContent = `${pace} 件 / 時間`;
      } else {
        resultEl.textContent = '- 件 / 時間';
      }
    }

    function updateUI() {
      let totalAmount = 0;
      let totalCount = 0;

      const logList = document.getElementById('log-list');
      logList.innerHTML = '';

      if (records.length === 0) {
        logList.innerHTML = '<div class="sub-text" style="text-align: center; padding: 10px;">履歴はありません</div>';
      } else {
        records.forEach(r => {
          totalAmount += (r.amount || r.fee || 0);
          totalCount += (r.count || 1);

          const pfName = r.platform || r.pf || '不明';
          const timeVal = r.time || (r.date ? r.date : '');

          const item = document.createElement('div');
          item.className = 'log-item';
          item.innerHTML = `
            <span><strong>${pfName}</strong> ${timeVal ? `(${timeVal})` : ''}</span>
            <span>${r.count || 1}件 / ${(r.amount || r.fee || 0).toLocaleString()}円</span>
          `;
          logList.appendChild(item);
        });
      }

      // 減算金額の計算
      const remAmount = TARGET_AMOUNT - totalAmount;

      document.getElementById('rem-amount').textContent = `${remAmount.toLocaleString()}円`;
      document.getElementById('curr-amount').textContent = `${totalAmount.toLocaleString()}円`;
      document.getElementById('curr-count').textContent = `${totalCount} / ${TARGET_COUNT}`;

      const avg = totalCount > 0 ? Math.round(totalAmount / totalCount) : 0;
      document.getElementById('avg-reward').textContent = `${avg.toLocaleString()}円`;

      calculatePace();
    }

    // 初期化
    updateUI();
  </script>
</body>
</html>
